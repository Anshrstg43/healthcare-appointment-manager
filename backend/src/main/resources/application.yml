server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: healthcare-appointment-manager

  # ─── Database ───────────────────────────────────────────────────────────────
  datasource:
    url: ${DATABASE_URL:${DB_URL:jdbc:mysql://localhost:3306/healthcare_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ─── JPA ─────────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: none          # Flyway owns and validates the schema migrations
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  # ─── Flyway Migrations ───────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ─── Mail (SMTP) ─────────────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        ssl:
          trust: ${MAIL_HOST:smtp.gmail.com}

  # ─── Jackson ─────────────────────────────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  # ─── Web ─────────────────────────────────────────────────────────────────────
  web:
    cors:
      allowed-origins: ${ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173,http://localhost:3000,https://*.vercel.app}}

# ─── Application Config ──────────────────────────────────────────────────────
app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173,http://localhost:3000,https://*.vercel.app}}
  # JWT
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-very-long-random-secret-key-at-least-512-bits}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}         # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 days

  # AI (OpenAI)
  ai:
    provider: openai
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o}
    timeout-seconds: 30
    max-retries: 2

  # Email
  mail:
    from: ${MAIL_FROM:noreply@healthcareapp.com}
    from-name: "Healthcare Appointment Manager"
    max-retries: 3
    retry-delay-ms: 5000

  # Google Calendar
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/calendar/callback}
    application-name: "Healthcare Appointment Manager"

  # Slot / Appointment
  appointments:
    hold-duration-minutes: 10     # How long a HELD slot is reserved
    default-slot-duration-minutes: 30

  # Frontend
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}

# ─── Actuator ────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ─── Logging ─────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.healthcare: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ─── OpenAPI / Swagger ────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
