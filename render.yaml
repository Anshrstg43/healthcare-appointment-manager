services:
  # ─── Spring Boot Backend Web Service ─────────────────────────────────────────
  - type: web
    name: healthcare-appointment-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        fromDatabase:
          name: healthcare-mysql
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: healthcare-mysql
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: healthcare-mysql
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"
      - key: OPENAI_API_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_HOST
        value: "smtp.gmail.com"
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_FROM
        value: "noreply@healthcareapp.com"

databases:
  - name: healthcare-mysql
    databaseName: healthcare_db
    user: healthcare_user
    plan: free
    region: oregon
