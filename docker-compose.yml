version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: healthcare-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: healthcare_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthcare-network

  # Spring Boot 3 Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthcare-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/healthcare_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: c674e30ef480ad9be29a1f2da930f3aa8f2c3d5e7a9b1c2d3e4f5a6b7c8d9e0f
      APP_FRONTEND_URL: http://localhost
    ports:
      - "8080:8080"
    networks:
      - healthcare-network

  # React Frontend with Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthcare-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - healthcare-network

volumes:
  mysql_data:
    driver: local

networks:
  healthcare-network:
    driver: bridge
